/**:
  ros__parameters:
    # gscam appends its own appsink; pipeline must end in system memory the encoder can read
    # 640x480 @ 30fps (down from 720p) to keep the raw rgb8 stream under the
    # WiFi link's headroom — foxglove_bridge ships uncompressed by default.
    gscam_config: "nvarguscamerasrc sensor-id=0 ! video/x-raw(memory:NVMM),width=1280,height=720,framerate=30/1,format=NV12 ! nvvidconv ! video/x-raw,width=640,height=480,format=BGRx ! videoconvert"
    image_encoding: "rgb8"
    frame_id: "camera_frame"
    camera_name: "imx219"
    use_gst_timestamps: false
    preroll: false
    sync_sink: true
