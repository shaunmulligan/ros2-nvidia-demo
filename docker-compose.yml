# ROS2 Jazzy demo: CSI camera -> TensorRT detection -> presence logic -> Foxglove
version: "2.1"

services:
  balena-supervisor-node:
    # <arch> is aarch64 or amd64; write it out for the devices in this fleet
    image: bh.cr/balenasolutions/ros-balena-supervisor-jazzy-aarch64/0.1.0
    restart: always
    labels:
      io.balena.features.supervisor-api: '1'
    environment:
      # The block's upstream README defaults to rmw_fastrtps_cpp on domain 0.
      # Both must match the rest of the graph or the node starts cleanly and is
      # never discovered, with no error on either side.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "42"
      # Destructive services stay hidden unless switched on -- see Configuration
      SUPERVISOR_NODE_ENABLE_POWER_CONTROL: 'false'
    networks:
      # Not the upstream `network_mode: host`: CycloneDDS auto-selects a single
      # interface, and on the host netns that is eth0/wlan0, never the rosnet
      # bridge. The supervisor-api label makes the supervisor attach this
      # service to its own `supervisor0` network on top of this one, so
      # BALENA_SUPERVISOR_ADDRESS still resolves off host networking.
      - rosnet
  camera:
    build:
      context: .
      target: camera
    image: ros2-demo/camera:0.3.0
    runtime: nvidia
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "42"
    networks:
      - rosnet
    restart: unless-stopped

  detection:
    build:
      context: .
      target: detection
    image: ros2-demo/detection:0.4.0
    runtime: nvidia
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "42"
    volumes:
      - trt-cache:/usr/local/bin/networks
    networks:
      - rosnet
    depends_on:
      - camera
    restart: unless-stopped

  logic:
    build: ./logic
    image: ros2-demo/logic:0.3.0
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "42"
    networks:
      - rosnet
    depends_on:
      - detection
    restart: unless-stopped

  viz:
    build: ./viz
    image: ros2-demo/viz:0.5.0
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "42"
      # Set to "true" (via balena device/fleet variables) to enable the
      # foxglove_bridge cloud relay — no inbound port required, viewable from
      # any Foxglove client signed into the same org. Also requires
      # FOXGLOVE_DEVICE_TOKEN (foxglove.dev → Devices → Create Device Token).
      FOXGLOVE_REMOTE_ACCESS: ""
      FOXGLOVE_DEVICE_TOKEN: ""
    ports:
      - "8765:8765"
    networks:
      - rosnet
    restart: unless-stopped

networks:
  rosnet:
    driver: bridge

volumes:
  trt-cache:

